services:
  cashflow-app:
    build:
      context: ./app-next
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
    environment:
      PORT: 8080
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      MONGO_URL: ${MONGO_URL}
    # Production reaches the app only via the cloudflared tunnel. Uncomment to also
    # expose it on the host for local testing before the tunnel is set up:
    # ports:
    #   - "8080:8080"
    networks: [shared-db, internal]
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # Locally-managed tunnel "cashflow-beyond" (ingress in cloudflared/config.yml).
    # The tunnel + DNS (cashflow.jeerawut.com) are already created; credentials.json
    # is gitignored and provided locally.
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on: [cashflow-app]
    networks: [internal]
    restart: unless-stopped

networks:
  shared-db:
    external: true
  internal: {}
